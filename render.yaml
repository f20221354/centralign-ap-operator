# Render Blueprint: New + > Blueprint, pick this repo. Fill the "sync: false" variables in the dashboard.
services:
  - type: web
    name: centralign-operator
    runtime: docker
    plan: free               # 512 MB: peak was ~290 MB in testing, so tight but workable. Use starter if Chromium gets killed.
    healthCheckPath: /healthz
    envVars:
      - key: CONSOLE_PASSWORD
        generateValue: true  # Render creates a random password; read it in the dashboard under Environment
      - key: LLM_CHAIN
        value: groq,gemini,mistral,openrouter   # no local Ollama in the cloud; providers without a key are skipped
      - key: ERP_URL
        value: https://centralign-ap-operator.vercel.app
      - key: ERP_API_KEY
        sync: false
      - key: ERP_USER
        sync: false
      - key: ERP_PASS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
